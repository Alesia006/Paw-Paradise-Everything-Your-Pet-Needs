 <!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact - Paw Paradise</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
html, body {
  height: 100%;
  margin: 0;
  font-family: Arial, sans-serif;
}

body {
  display: flex;
  flex-direction: column;
  background: linear-gradient(rgba(103, 22, 197,0.7), rgba(77,171,247,0.6));
  min-height: 100vh;
}

/* Navbar */
.navbar {
  background-color: rgba(0,0,0,0.3); /* transparencë pak për t'u dukur mirë mbi gradient */
  backdrop-filter: blur(10px);
}

/* Hero Title */
.hero-heading {
  text-align: center;
  margin: 50px 0 30px;
  flex-shrink: 0;
}
.hero-heading h2 {
  font-size: 2.5rem;
  font-weight: bold;
  color: white;
  text-shadow: 1px 1px 8px rgba(0,0,0,0.5);
}

/* Glass Card */
.glass {
  background: rgba(255,255,255,0.2);
  backdrop-filter: blur(15px);
  border-radius: 20px;
  padding: 30px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.2);
}

/* Inputs */
.form-control {
  border-radius: 10px;
}

/* Buttons */
.btn-primary {
  border-radius: 25px;
  transition: 0.3s;
}
.btn-primary:hover {
  transform: scale(1.05);
}

/* Footer */
footer {
  color: white;
  text-align: center;
  padding: 20px 0;
  margin-top: auto; /* ky e shtyn footerin në fund */
  background-color: rgba(0,0,0,0.3);
  backdrop-filter: blur(5px);
}
</style>
</head>

<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark px-4">
  <a class="navbar-brand fw-bold" href="index.html">🐾 Paw Paradise - Everything Your Pet Needs 🐾</a>
  <div class="ms-auto">
    <a href="index.html" class="btn btn-light btn-sm mx-1">Home</a>
    <a href="products.html" class="btn btn-light btn-sm mx-1">Products</a>
    <a href="about.html" class="btn btn-light btn-sm mx-1">About</a>
    <a href="contact.html" class="btn btn-light btn-sm mx-1">Contact</a>
    <a href="cart.html" class="btn btn-warning btn-sm mx-1" id="cart">🛒 Cart (0)</a>
  </div>
</nav>

<!-- Hero Heading -->
<div class="container hero-heading">
  <h2>Get in Touch 💬</h2>
  <p class="lead text-white">We would love to hear from you!</p>
</div>

<!-- Main Content -->
<div class="container my-5 flex-grow-1">
  <div class="row g-4">

    <!-- Contact Form -->
    <div class="col-md-6">
      <div class="glass">
        <form onsubmit="sendMessage(event)">
          <input type="text" class="form-control mb-3" placeholder="Your Name" required>
          <input type="email" class="form-control mb-3" placeholder="Your Email" required>
          <textarea class="form-control mb-3" rows="4" placeholder="Your Message" required></textarea>
          <button class="btn btn-primary w-100">Send Message</button>
        </form>
      </div>
    </div>

    <!-- Contact Info -->
    <div class="col-md-6">
      <div class="glass text-white">
        <h5>📍 Location</h5>
        <p>Tirana, Albania</p>

        <h5>📧 Email</h5>
        <p>pawparadise@email.com</p>

        <h5>📞 Phone</h5>
        <p>+355 69 123 4567</p>

        <h5>🕒 Hours</h5>
        <p>Mon - Sat: 09:00 - 20:00</p>
      </div>
    </div>

  </div>
</div>

<!-- Footer -->
<footer>
  © 2026 Paw Paradise
</footer>

<script>
// Send message alert
function sendMessage(e){
  e.preventDefault();
  alert("Message Sent Successfully 🚀");
}

// Update cart count in navbar
function updateCartCount(){
  const cart = JSON.parse(localStorage.getItem("cart")) || [];
  const cartBtn = document.getElementById("cart");
  if(cartBtn) cartBtn.innerText = "🛒 Cart (" + cart.length + ")";
}
updateCartCount();
</script>

</body>
</html>
